# roles/cli/tasks/main.yml
---
- name: Instalar firefox-esr e xauth
  ansible.builtin.apt:
    name:
      - firefox-esr
      - xauth
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Habilitar X11Forwarding no sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^(#\s*)?X11Forwarding\b'
    insertbefore: '^Match\b'
    line: X11Forwarding yes
    validate: /usr/sbin/sshd -t -f %s
  notify: Reiniciar sshd
