---
- name: Criar banner de saudação
  ansible.builtin.copy:
    dest: /etc/issue.net
    owner: root
    group: root
    mode: "0644"
    content: "{{ ssh_banner_texto }}\n"

- name: Configurar sshd (drop-in com prioridade máxima)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ifpb.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Gerenciado pelo Ansible
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin no
      AllowGroups {{ ssh_allow_groups }}
      Banner /etc/issue.net
    validate: /usr/sbin/sshd -t -f %s
  notify: Reiniciar sshd

- name: Garantir que o drop-in seja incluído pelo sshd_config principal
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    insertbefore: BOF
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reiniciar sshd
