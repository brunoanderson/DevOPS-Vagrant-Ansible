# roles/arq/tasks/nfs.yml
---
- name: Instalar nfs-kernel-server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Criar o grupo do usuário NFS
  ansible.builtin.group:
    name: "{{ nfs_usuario }}"
    system: true
    state: present

- name: Criar o usuário NFS (sem shell de login)
  ansible.builtin.user:
    name: "{{ nfs_usuario }}"
    group: "{{ nfs_usuario }}"
    comment: Usuario NFS IFPB
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    state: present
  register: nfs_user

- name: Criar o diretório compartilhado (escrita somente para o dono)
  ansible.builtin.file:
    path: "{{ nfs_export }}"
    state: directory
    owner: "{{ nfs_usuario }}"
    group: "{{ nfs_usuario }}"
    mode: "0755"

- name: Configurar o /etc/exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reexportar NFS

- name: Garantir nfs-server habilitado e em execução
  ansible.builtin.service:
    name: nfs-server
    state: started
    enabled: true
