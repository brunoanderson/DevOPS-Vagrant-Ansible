# roles/db/tasks/main.yml
---
- name: Instalar mariadb-server
  ansible.builtin.apt:
    name: mariadb-server
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Garantir mariadb habilitado e em execução
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true
